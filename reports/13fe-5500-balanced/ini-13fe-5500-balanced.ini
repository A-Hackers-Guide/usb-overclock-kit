; usb-overclock-kit INI OVERLAY — profile 'balanced'
; Drive VID:PID : 13fe:5500
; Detected family: Phison PS2309 Boot ROM
; A general-purpose profile — the drive the OEM should have shipped. Reasonable OP, modest pSLC, SuperSpeed forced, factory-safe thermal setpoint. Suitable as a daily-driver USB stick for mixed read/write.
; Capacity impact: 64 GB advertised → ~46 GB usable
;
; THIS IS AN OVERLAY — merge each line below into the SAME
; section of your real MPTool base INI. Keep every other line
